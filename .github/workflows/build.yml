name: Test and build First Descent

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned official Godot and Web templates
        run: python3 tools/install_godot.py
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: Core regression checks
        run: XDG_DATA_HOME="$RUNNER_TEMP/awb-core" godot --headless --path . --script tests/test_core.gd
      - name: Expedition integration checks
        run: XDG_DATA_HOME="$RUNNER_TEMP/awb-expedition" godot --headless --path . --script tests/test_expedition.gd
      - name: Specimen inspection checks
        run: XDG_DATA_HOME="$RUNNER_TEMP/awb-specimen" godot --headless --path . --script tests/test_specimen.gd
      - name: Water interaction checks
        run: XDG_DATA_HOME="$RUNNER_TEMP/awb-water" godot --headless --path . --script tests/test_water.gd
      - name: Independent multitouch checks
        run: XDG_DATA_HOME="$RUNNER_TEMP/awb-touch" godot --headless --path . --script tests/test_multitouch.gd
      - name: Living ocean checks
        run: XDG_DATA_HOME="$RUNNER_TEMP/awb-living" godot --headless --path . --script tests/test_living_ocean.gd
      - name: Export browser build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          python3 tools/package_web.py
      - name: Upload playable Web files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: A-World-Below-web
          path: build/web
          retention-days: 14
